name: Seguimiento de leads de venta BPGO

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bpgo-sales-lead-followup
  cancel-in-progress: false

jobs:
  follow-up:
    name: Revisar leads con factibilidad sin respuesta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtener identidad OIDC de GitHub
        id: oidc
        shell: bash
        run: |
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bpgo-sales-followup")"
          token="$(printf '%s' "$token_response" | jq -r '.value')"
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Ejecutar revisión de leads
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            https://operaciones.bpgo.cl/api/whatsapp/sales-leads/follow-up
