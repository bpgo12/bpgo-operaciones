name: Actualizar teléfono web BPGO

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-public-phone.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Descargar sitio público actual
        run: |
          wget --mirror --page-requisites --convert-links --adjust-extension \
            --no-host-directories --directory-prefix=public-site \
            --domains=bpgo.cl,www.bpgo.cl https://bpgo.cl/

      - name: Reemplazar teléfono oficial
        run: |
          find public-site -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' \) -print0 |
            xargs -0 sed -i \
              -e 's/56996384861/56941985967/g' \
              -e 's/+56 9 9638 4861/+56 9 4198 5967/g'
          if grep -R -E '56996384861|\+56 9 9638 4861' public-site; then
            echo 'El número anterior continúa presente.' >&2
            exit 1
          fi
          grep -R -E '56941985967|\+56 9 4198 5967' public-site

      - name: Consultar proyectos Cloudflare
        id: cloudflare-projects
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list

      - name: Identificar proyecto de bpgo.cl
        env:
          PROJECTS_LIST: ${{ steps.cloudflare-projects.outputs.command-output }}
        run: |
          PROJECT_NAME="$(printf '%s\n' "$PROJECTS_LIST" | awk -F '│' '/(^|[,[:space:]│])bpgo\.cl([,[:space:]│]|$)/ { for (i = 1; i <= NF; i++) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $i); if ($i != "") { print $i; exit } } }')"
          test -n "$PROJECT_NAME"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          PROJECT_DATA="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          PRODUCTION_BRANCH="$(printf '%s' "$PROJECT_DATA" | jq -r '.result.production_branch // empty')"
          test -n "$PRODUCTION_BRANCH"
          echo "PRODUCTION_BRANCH=$PRODUCTION_BRANCH" >> "$GITHUB_ENV"

      - name: Publicar sitio actualizado
        run: npx wrangler@4 pages deploy public-site --project-name="$PROJECT_NAME" --branch="$PRODUCTION_BRANCH"

      - name: Diagnostico de despliegue
        if: always()
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" > project.json
          INFO="$(jq -c '.result | {name, domains, production_branch, latest: .latest_deployment.url, env: .latest_deployment.environment}' project.json)"
          echo "::notice title=Proyecto::$INFO"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/deployments?per_page=3" > deployments.json
          LIST="$(jq -c '[.result[] | {url, environment}]' deployments.json)"
          echo "::notice title=Despliegues::$LIST"

      - name: Verificar número en producción
        run: |
          for attempt in 1 2 3 4 5; do
            PAGE="$(curl --fail --silent --show-error "https://bpgo.cl/?phone-check=$(date +%s)-$attempt")"
            SCRIPT="$(curl --fail --silent --show-error "https://bpgo.cl/script.js?phone-check=$(date +%s)-$attempt")"
            if printf '%s\n%s' "$PAGE" "$SCRIPT" | grep -q '56941985967' && \
               ! printf '%s\n%s' "$PAGE" "$SCRIPT" | grep -q '56996384861'; then
              exit 0
            fi
            sleep 10
          done
          echo 'bpgo.cl todavía entrega el número anterior.' >&2
          exit 1
