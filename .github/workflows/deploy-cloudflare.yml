name: Publicar BPGO Operaciones

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bpgo-operaciones-produccion
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar en Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Publicar proyecto existente
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=bpgo-operaciones --branch=main

