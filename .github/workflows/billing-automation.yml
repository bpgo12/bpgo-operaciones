name: Cobranza automática BPGO

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

concurrency:
  group: bpgo-cobranza-automatica
  cancel-in-progress: false

jobs:
  billing:
    name: Revisar y ejecutar cobranza diaria
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtener identidad OIDC de GitHub
        id: oidc
        shell: bash
        run: |
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bpgo-billing-automation")"
          token="$(printf '%s' "$token_response" | jq -r '.value')"
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Ejecutar revisión diaria
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            https://operaciones.bpgo.cl/api/billing/automation/run
